<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecallRx</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('recallrx-theme');
                document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'dark');

                var l = localStorage.getItem('recallrx-lang');
                if (l) {
                    document.documentElement.setAttribute('lang', l);
                    document.documentElement.setAttribute('data-lang', l);
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/app.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

    <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
        <defs>
            <linearGradient id="gradB" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c5ce8" />
                <stop offset="55%" stop-color="#2f5c9c" />
                <stop offset="100%" stop-color="#0b4f5c" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-shell">

        <header class="top-sticky-bar">
            <div class="brand">
                <button id="sidebar-toggle" class="theme-toggle-btn" type="button" title="Toggle sidebar">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                RecallRx

                <button id="lang-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle language">
                    <span id="lang-toggle-label" style="font-weight:700;font-size:13px;letter-spacing:0.02em;">EN</span>
                </button>

                <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </header>


        <div class="app-layout-container">

            <div class="sidebar-wrapper open" id="sidebar-wrapper">

                <aside class="controls-sidebar">
                    <div class="sidebar-scrollable-content">

                        <div class="acc-section open" data-acc="lists">
                            <div class="acc-header">
                                <span data-i18n="lists">Lists</span>
                                <span class="acc-chevron">▸</span>
                            </div>
                            <div class="acc-body">
                                <div class="acc-body-inner">
                                    <select id="list-select" class="ctrl-select"></select>
                                    <div class="ctrl-row">
                                        <button id="list-new-btn" class="ctrl-btn" data-i18n-title="newList"
                                            title="New list">➕</button>
                                        <button id="list-rename-btn" class="ctrl-btn" data-i18n-title="renameList"
                                            title="Rename list">✏️</button>
                                        <button id="list-delete-btn" class="ctrl-btn danger"
                                            data-i18n-title="deleteList" title="Delete list">🗑️</button>
                                    </div>
                                    <div class="ctrl-row">
                                        <button id="list-export-btn" class="ctrl-btn" data-i18n-title="exportList"
                                            title="Export list">Exp ⬇️</button>
                                        <button id="list-import-btn" class="ctrl-btn" data-i18n-title="importList"
                                            title="Import list">Imp ⬆️</button>
                                    </div>
                                    <div class="ctrl-row">
                                        <button id="add-row-btn" class="ctrl-btn half" data-i18n="addRow">+ Add Row</button>
                                        <button id="clear-btn" class="ctrl-btn half danger" data-i18n="clearContent">Clear Content</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="acc-section" data-acc="notes">
                            <div class="acc-header">
                                <span data-i18n="notes">Notes</span>
                                <span class="acc-chevron">▸</span>
                            </div>
                            <div class="acc-body">
                                <div class="acc-body-inner">
                                    <select id="note-select" class="ctrl-select"></select>
                                    <div class="ctrl-row">
                                        <button id="note-new-btn" class="ctrl-btn" data-i18n-title="newNote"
                                            title="New note">➕</button>
                                        <button id="note-rename-btn" class="ctrl-btn" data-i18n-title="renameNote"
                                            title="Rename note">✏️</button>
                                        <button id="note-delete-btn" class="ctrl-btn danger"
                                            data-i18n-title="deleteNote" title="Delete note">🗑️</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="acc-section" data-acc="controls">
                            <div class="acc-header">
                                <span data-i18n="controls">Controls</span>
                                <span class="acc-chevron">▸</span>
                            </div>
                            <div class="acc-body">
                                <div class="acc-body-inner">

                                    <p class="ctrl-label"><span data-i18n="speed">Speed</span>: <strong id="speed-value"
                                            style="color:var(--accent-mid);">0.75x</strong></p>
                                    <input type="range" id="speed-slider" min="0.25" max="2" step="0.25" value="0.75"
                                        style="width:100%;">

                                    <div class="playback-row">
                                        <button id="rewind-btn" class="pb-btn" title="Rewind" aria-label="Rewind">
                                            <svg viewBox="0 0 24 24">
                                                <polygon points="11 6 11 18 3 12" />
                                                <polygon points="21 6 21 18 13 12" />
                                                <line x1="21" y1="6" x2="21" y2="18" />
                                            </svg>
                                        </button>
                                        <button id="stop-btn" class="pb-btn" title="Stop" aria-label="Stop">
                                            <svg viewBox="0 0 24 24">
                                                <rect x="6" y="6" width="12" height="12" rx="2" />
                                            </svg>
                                        </button>
                                        <button id="read-btn" class="pb-btn play-pause" title="Read" aria-label="Read">
                                            <svg class="icon-play" viewBox="0 0 24 24">
                                                <polygon points="8 5 19 12 8 19" />
                                            </svg>
                                            <svg class="icon-pause" viewBox="0 0 24 24">
                                                <rect x="6" y="5" width="4" height="14" rx="1" />
                                                <rect x="14" y="5" width="4" height="14" rx="1" />
                                            </svg>
                                        </button>
                                        <button id="forward-btn" class="pb-btn" title="Forward" aria-label="Forward">
                                            <svg viewBox="0 0 24 24">
                                                <polygon points="3 6 3 18 11 12" />
                                                <polygon points="13 6 13 18 21 12" />
                                                <line x1="3" y1="6" x2="3" y2="18" />
                                            </svg>
                                        </button>
                                        <button id="loop-check" class="pb-btn loop-off" title="Loop" aria-label="Loop">
                                            <svg viewBox="0 0 24 24">
                                                <path d="M17 2l4 4-4 4" />
                                                <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                                                <path d="M7 22l-4-4 4-4" />
                                                <path d="M21 13v1a4 4 0 0 1-4 4H3" />
                                            </svg>
                                        </button>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <div class="acc-section" data-acc="voices">
                            <div class="acc-header">
                                <span data-i18n="voices">Voices</span>
                                <span class="acc-chevron">▸</span>
                            </div>
                            <div class="acc-body">
                                <div class="acc-body-inner">
                                    <select id="gender-filter" class="ctrl-select">
                                        <option value="all" data-i18n="allGenders">All Genders</option>
                                        <option value="female" data-i18n="femaleOnly">Female Only</option>
                                        <option value="male" data-i18n="maleOnly">Male Only</option>
                                    </select>
                                    <input type="text" id="voice-search" class="ctrl-input"
                                        data-i18n-placeholder="searchVoices" placeholder="Search voices...">
                                    <select id="voice-select" class="ctrl-select">
                                        <option>Loading voices...</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="sidebar-footer">

                            <div class="footer-block">
                                <div class="footer-label" data-i18n="timer">Timer</div>

                                <div class="ctrl-row">
                                    <div id="timer-display" class="timer-display">00:00.0</div>
                                    <button id="timer-reset-btn" class="ctrl-btn half" data-i18n="resetTimer">Reset
                                        Timer</button>
                                </div>
                            </div>

                            <div class="metrics-row">
                                <span><span data-i18n="chars">Chars</span>: <strong id="char-count">0</strong></span>
                                <span><span data-i18n="est">Est</span>: <strong id="time-estimate">0m 0s</strong></span>
                            </div>

                        </div>

                    </div>
                </aside>

                <main class="input-workspace">
                    <div id="spreadsheet-container" class="spreadsheet-grid">
                        <div class="cell header-cell" data-col="A">
                            <div class="header-split-wrapper">
                                <span class="header-label" data-col="A"><span class="header-prefix prefix-start" data-i18n="startTest">Start Test</span><span class="header-prefix prefix-show" data-i18n="showColumn">Show Column</span></span>
                                <button class="header-sort-btn" title="Sort A-Z / Z-A">⇅</button>
                            </div>
                            <div class="resizer"></div>
                        </div>
                        <div class="cell header-cell" data-col="B">
                            <div class="header-split-wrapper">
                                <span class="header-label" data-col="B"><span class="header-prefix prefix-start" data-i18n="startTest">Start Test</span><span class="header-prefix prefix-show" data-i18n="showColumn">Show Column</span></span>
                                <button class="header-sort-btn" title="Sort A-Z / Z-A">⇅</button>
                            </div>
                        </div>
                    </div>

                    <div class="row-resizer"></div>

                    <div id="recall-viewer"></div>
                    <textarea id="note-area" placeholder="Type or paste your note..." spellcheck="false"></textarea>
                    <div id="note-resizer"></div>
                </main>

            </div>

        </div>

        <div class="mobile-playback-bar">
            <button id="m-rewind-btn" class="pb-btn" title="Rewind" aria-label="Rewind">
                <svg viewBox="0 0 24 24">
                    <polygon points="11 6 11 18 3 12" />
                    <polygon points="21 6 21 18 13 12" />
                    <line x1="21" y1="6" x2="21" y2="18" />
                </svg>
            </button>
            <button id="m-stop-btn" class="pb-btn" title="Stop" aria-label="Stop">
                <svg viewBox="0 0 24 24">
                    <rect x="6" y="6" width="12" height="12" rx="2" />
                </svg>
            </button>
            <button id="m-read-btn" class="pb-btn play-pause" title="Read" aria-label="Read">
                <svg class="icon-play" viewBox="0 0 24 24">
                    <polygon points="8 5 19 12 8 19" />
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24">
                    <rect x="6" y="5" width="4" height="14" rx="1" />
                    <rect x="14" y="5" width="4" height="14" rx="1" />
                </svg>
            </button>
            <button id="m-forward-btn" class="pb-btn" title="Forward" aria-label="Forward">
                <svg viewBox="0 0 24 24">
                    <polygon points="3 6 3 18 11 12" />
                    <polygon points="13 6 13 18 21 12" />
                    <line x1="3" y1="6" x2="3" y2="18" />
                </svg>
            </button>
            <button id="m-loop-check" class="pb-btn loop-off" title="Loop" aria-label="Loop">
                <svg viewBox="0 0 24 24">
                    <path d="M17 2l4 4-4 4" />
                    <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                    <path d="M7 22l-4-4 4-4" />
                    <path d="M21 13v1a4 4 0 0 1-4 4H3" />
                </svg>
            </button>
            <button id="m-menu-btn" class="pb-btn" title="Menu" aria-label="Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
        </div>

        <!-- Mobile popups: outside the bar so they aren't clipped -->
        <div class="mobile-popup" id="m-menu-popup">
            <button class="mobile-popup-item" id="m-speed-open-btn" data-i18n="speed">Speed</button>
        </div>

        <div class="mobile-popup" id="m-speed-popup">
            <button class="mobile-popup-item speed-opt" data-speed="2">2.0x</button>
            <button class="mobile-popup-item speed-opt" data-speed="1.5">1.5x</button>
            <button class="mobile-popup-item speed-opt" data-speed="1.25">1.25x</button>
            <button class="mobile-popup-item speed-opt" data-speed="1">1.0x</button>
            <button class="mobile-popup-item speed-opt" data-speed="0.75">0.75x</button>
            <button class="mobile-popup-item speed-opt" data-speed="0.5">0.5x</button>
            <button class="mobile-popup-item speed-opt" data-speed="0.25">0.25x</button>
        </div>

    </div>

    <div class="modal-overlay" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <div class="modal-card">
            <h3 class="modal-title" id="confirm-modal-title">Confirm</h3>
            <p class="modal-message" id="confirm-modal-message">Are you sure?</p>
            <div class="modal-actions">
                <button class="modal-btn" id="confirm-modal-cancel" type="button">Cancel</button>
                <button class="modal-btn confirm" id="confirm-modal-ok" type="button">Confirm</button>
            </div>
        </div>
    </div>

    <input type="file" id="list-import-input" accept=".txt,.csv,text/plain" hidden>

    <script>
        function guaranteeEmptyTargetRow() {
            const container = document.getElementById('spreadsheet-container') || window.spreadsheetContainer;
            if (!container) return;
            const dataCells = container.querySelectorAll('.data-cell');
            if (dataCells.length === 0 && typeof createRowCells === 'function') {
                createRowCells(1, "", "");
            }
        }
        window.addEventListener('load', () => setTimeout(guaranteeEmptyTargetRow, 50));
    </script>

    <!-- Locales first so the engine can read them -->
    <script src="js/locales/en.js"></script>
    <script src="js/locales/vi.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/config.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/exam.js"></script>
    <script src="js/sorting.js"></script>
    <script src="js/spreadsheet.js"></script>
    <script src="js/lists-notes.js"></script>
    <script src="js/speech.js"></script>

</body>

</html>
