<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word HideRx</title>
    <link rel="stylesheet" href="styles/base-ds.css">
    <link rel="stylesheet" href="styles/app-ds.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

    <div class="app-layout-container">
        <!-- Sidebar toggle (pure CSS via checkbox) -->
        <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">
        <script>
            const toggle = document.getElementById('sidebar-toggle');
            const mq = window.matchMedia('(max-width: 700px)');
            const apply = () => {toggle.checked = mq.matches;};
            apply();
            mq.addEventListener('change', apply);
        </script>

        <label for="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar"></label>

        <aside class="controls-sidebar">
            <div class="mobile-sticky-header">
                <div class="sidebar-header">
                    <h2>Word HideRx</h2>
                </div>
            </div>

            <div class="sidebar-scrollable-content">

                <div class="control-group">
                    <h3>Lists</h3>
                    <select id="list-select"></select>
                    <div class="engine-controls-row">
                        <button id="list-new-btn" title="New list">➕</button>
                        <button id="list-rename-btn" title="Rename list">✏️</button>
                        <button id="list-delete-btn" class="danger-btn" title="Delete list">🗑️</button>
                    </div>
                    <div class="engine-controls-row">
                        <button id="list-export-btn" title="Export list">Exp ⬇️</button>
                        <button id="list-import-btn" title="Import list">Imp ⬆️</button>
                    </div>
                    <button id="add-row-btn">+ Add Row</button>
                    <button id="clear-btn" class="danger-btn">Clear Columns</button>
                </div>

                <div class="control-group">
                    <h3>Note</h3>
                    <select id="note-select"></select>
                    <div class="engine-controls-row">
                        <button id="note-new-btn" title="New note">➕</button>
                        <button id="note-rename-btn" title="Rename note">✏️</button>
                        <button id="note-delete-btn" class="danger-btn" title="Delete note">🗑️</button>
                    </div>
                </div>

                <div id="audio-controls">


                    <div class="control-group">
                        <h3>Engine Controls</h3>
                        <div class="engine-controls-row">
                            <button id="read-btn" class="primary-btn">Read</button>
                            <button id="stop-btn" class="danger-btn">Stop</button>
                        </div>
                        <button id="loop-check">Loop: OFF</button>

                        <div class="slider-container">
                            <label for="speed-slider">Speed: <span id="speed-value">0.5x</span></label>
                            <input type="range" id="speed-slider" min="0.1" max="2" step="0.1" value="0.5">
                        </div>
                    </div>

                    <div class="navigation-controls-row">
                        <button id="rewind-btn">⏪ RWD</button>
                        <button id="forward-btn">FF ⏩</button>
                    </div>

                    <div class="control-group">
                        <h3>Voice Config</h3>
                        <select id="gender-filter">
                            <option value="all">All Genders</option>
                            <option value="female">Female Only</option>
                            <option value="male">Male Only</option>
                        </select>
                        <input type="text" id="voice-search" placeholder="Search voices...">
                        <select id="voice-select">
                            <option>Loading voices...</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <h3>Timer</h3>
                        <div id="timer-display">00:00.0</div>
                        <button id="timer-reset-btn">Reset Timer</button>
                    </div>

                    <div class="control-group">
                        <div class="metrics-row">
                            <span>Chars: <strong id="char-count">0</strong></span>
                            <span>Est. Time: <strong id="time-estimate">0m 0s</strong></span>
                        </div>
                    </div>
                </div>



            </div>
        </aside>

        <main class="input-workspace">
            <div id="spreadsheet-container" class="spreadsheet-grid">
                <div class="cell header-cell" data-col="A">
                    <div class="header-split-wrapper">
                        <span class="header-label" data-col="A"></span>
                        <button class="header-sort-btn" title="Sort A-Z / Z-A">⇅</button>
                    </div>
                    <div class="resizer"></div>
                </div>
                <div class="cell header-cell" data-col="B">
                    <div class="header-split-wrapper">
                        <span class="header-label" data-col="B"></span>
                        <button class="header-sort-btn" title="Sort A-Z / Z-A">⇅</button>
                    </div>
                </div>
            </div>

            <div class="row-resizer"></div>

            <div id="recall-viewer"></div>
            <textarea id="note-area" placeholder="Type or paste your note..." spellcheck="false"></textarea>
            <div id="note-resizer"></div>
        </main>
    </div>

    <input type="file" id="list-import-input" accept=".txt,.csv" hidden>

    <script>
        function guaranteeEmptyTargetRow() {
            const container = document.getElementById('spreadsheet-container') || window.spreadsheetContainer;
            if (!container) return;
            const dataCells = container.querySelectorAll('.data-cell');
            if (dataCells.length === 0 && typeof createRowCells === 'function') {
                createRowCells(1, "", "");
            }
        }
        window.addEventListener('load', () => setTimeout(guaranteeEmptyTargetRow, 50));
    </script>



    <script src="js/app-ds-v2.js"></script>
    <script src="js/config.js"></script>
    <script src="js/exam-cl-v5.js"></script>
    <script src="js/sorting.js"></script>
    <script src="js/spreadsheet-cl-v4.js"></script>
    <script src="js/list-io.js"></script> <!-- moved down -->
    <script src="js/notes.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/tts-engine.js"></script>

</body>

</html>
