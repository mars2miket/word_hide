<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word HideRx</title>
    <!-- Links safely to your external separate CSS style layout file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-layout-container">
        <!-- 1. PURE-CSS COLLAPSIBLE TRIGGER CONTROLLER -->
        <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">

        <!-- 2. STICKY FLOATING TOGGLE BUTTON ENGINE -->
        <label for="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar"></label>

        <!-- 3. CONFIGURABLE SIDEBAR WORKSPACE LAYER -->
        <aside class="controls-sidebar">

            <!-- Mobile-Sticky Header Mask Container -->
            <div class="mobile-sticky-header">
                <div class="sidebar-header">
                    <h2>Word HideRx</h2>
                </div>
            </div>

            <!-- Scrollable System Controller Panel Layout Stack -->
            <div class="sidebar-scrollable-content">
                <!-- Metrics Panel Track Engine -->
                <div class="metrics-row">
                    <span>Chars: <strong id="char-count">0</strong></span>
                    <span>Est. Time: <strong id="time-estimate">0m 0s</strong></span>
                </div>

                <!-- Control Module Block: Core Engine Controls -->
                <div class="control-group">
                    <h3>Engine Controls</h3>
                    <div class="engine-controls-row">
                        <button id="read-btn" class="primary-btn">Read</button>
                        <button id="stop-btn" class="danger-btn">Stop</button>
                    </div>
                    <button id="loop-check">Loop: OFF</button>

                    <!-- Speed Engine Modulator Container -->
                    <div class="slider-container">
                        <label for="speed-slider">Speed: <span id="speed-value">0.5x</span></label>
                        <input type="range" id="speed-slider" min="0.1" max="2" step="0.1" value="0.5">
                    </div>
                </div>

                <!-- Control Module Block: Manual Navigation Streams -->
                <div class="control-group">

                    <div class="navigation-controls-row">
                        <button id="rewind-btn">⏪ Rewind</button>
                        <button id="forward-btn">Forward ⏩</button>
                    </div>
                </div>

                <!-- Control Module Block: TTS Voice Distribution Layer -->
                <div class="control-group">
                    <h3>Voice Config</h3>
                    <select id="gender-filter">
                        <option value="all">All Genders</option>
                        <option value="female">Female Only</option>
                        <option value="male">Male Only</option>
                    </select>
                    <input type="text" id="voice-search" placeholder="Search voices...">
                    <select id="voice-select">
                        <option>Loading voices...</option>
                    </select>
                </div>

                <!-- Control Module Block: Storage Purge Mechanical Triggers -->
                <div class="control-group">
                    <button id="clear-btn" class="danger-btn">Clear Columns</button>
                </div>

                <!-- Control Module Block: High-Precision Performance Stopwatch -->
                <div class="control-group">
                    <h3>Timer</h3>
                    <div id="timer-display">00:00.0</div>
                    <button id="timer-reset-btn">Reset Timer</button>
                </div>
            </div>
        </aside>

        <!-- 4. ACTIVE SPREADSHEET MATRIX AND OUTPUT VIEWER LAYER -->
        <main class="input-workspace">
            <!-- Data Grid Structure Pipeline Framework -->
            <div id="spreadsheet-container" class="spreadsheet-grid">
                <!-- Column Core Interactive Header Templates -->
                <div class="cell header-cell" data-col="A">
                    <span class="header-label"></span>
                    <div class="resizer"></div>
                </div>
                <div class="cell header-cell" data-col="B">
                    <span class="header-label"><!--can put text hear to append--></span>
                </div>
                <!-- Dynamic Content Cells generated automatically via scripts: setSpreadsheetText() -->
            </div>

            <!-- Vertical Ergonomic Split Workspace Layout Track Buffer Handle -->
            <div class="row-resizer"></div>

            <!-- Dynamic Active Recall Text Compilation Stream Monitor Viewport -->
            <div id="recall-viewer" class="hidden"></div>
        </main>
    </div>

    <!-- Links safely to your external separate JavaScript engine logic file -->


    <script>// --- AUTO-RESTORE BLANK ROW INITIALIZER (Add to the very bottom of script.js) ---

        function guaranteeEmptyTargetRow() {
            // 1. Locate your spreadsheet container element safely
            const container = document.getElementById('spreadsheet-container') || window.spreadsheetContainer;
            if (!container) return;

            // 2. Count how many data cells currently exist in the DOM
            const dataCells = container.querySelectorAll('.data-cell');

            // 3. If the recovery script left the grid completely blank, force-create Row 1
            if (dataCells.length === 0) {
                if (typeof createRowCells === 'function') {
                    createRowCells(1, "", "");
                } else {
                    // Hardcoded structural layout fallback if createRowCells isn't accessible
                    const cellA = document.createElement('div');
                    cellA.className = 'cell data-cell';
                    cellA.dataset.row = "1";
                    cellA.dataset.col = 'A';
                    cellA.contentEditable = 'true';

                    const cellB = document.createElement('div');
                    cellB.className = 'cell data-cell';
                    cellB.dataset.row = "1";
                    cellB.dataset.col = 'B';
                    cellB.contentEditable = 'true';

                    container.appendChild(cellA);
                    container.appendChild(cellB);
                }
            }
        }

        // Run the check on page load, but defer it slightly to let your localStorage parser finish first
        window.addEventListener('load', () => {
            setTimeout(guaranteeEmptyTargetRow, 50);
        });
    </script>

    <script src="config.js"></script>
    <script src="spreadsheet.js"></script>
    <script src="exam.js"></script>
    <script src="timer.js"></script>
    <script src="tts-engine.js"></script>
</body>

</html>
